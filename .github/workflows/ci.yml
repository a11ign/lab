# The merge gate. Every pull request and every merge-queue entry runs lint, the typecheck and the tests, and the single job below is named `gate` because that is the check
# `main`'s protection and the `merge-queue-main` ruleset require (`docs/code-repository-protection.json` in a11ign/a11ign names it). `merge_group` is what lets the queue's
# temporary branches run it: a required check that never runs on one blocks the queue for ever.
#
# THIS REPOSITORY IS NOT SELF-CONTAINED, AND CI SAYS SO BY CONSTRUCTION (a11ign/a11ign#2703). `lab` reaches the core's `scripts/`, the private `guards` package, root files and
# unexported files of four published packages by relative path (569 `checkout-path` edges in the core's layer-edge baseline, #3501's finding 2), and its manifest names the
# monorepo's WORKSPACE versions of `@a11ign/evidence`, `judge`, `scorer`, `screenreader-fleet` and `a11ign`, which are not what the registry holds (0.1.0 where it pins 0.2.x), plus
# `@a11ign/control` and `@a11ign/nvda-speech`, which the registry does not have at all. So nothing in `packages/lab` installs on its own. The job therefore LAYS `packages/lab` OVER
# a checkout of a11ign/a11ign at the commit pinned in `CORE_REF`, installs THERE (the workspace resolves what the registry cannot), and runs the core's own eslint, tsc and rstest
# config over it: the one toolchain, not a copy of it. `pnpm install` is not frozen because a pull request here may change `packages/lab/package.json` (Dependabot does), and the core's
# lockfile cannot know it; the install is ephemeral and its lockfile is thrown away with the runner.
#
# BUMPING `CORE_REF` IS A PULL REQUEST, and the only way the core's changes reach this repository's CI: Dependabot cannot read a commit pin, so `scripts/ci-composition.test.ts` holds
# it to a full commit sha and nothing else. Ubuntu only, and a two-commit checkout of the core: the tests that need the full history say so and skip by name (`lab-extraction.test.ts`); the
# ones that need the corpus, the fleet or the lab's host skip on their own guards. No test here is a verdict on the corpus: that is the lab's, run by the agent driving it.
name: ci

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # a11ign/a11ign at the commit `packages/lab` was last synced from (eae7806ca, 2026-10-06; first cut from d533ad216136, 2026-10-05). A sha and never a branch: a branch moves under a pull request that did not touch it.
  CORE_REF: eae7806ca688c609c183565c0143d49d41e2f483

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: lab }
      - uses: actions/checkout@v7
        # fetch-depth 2, not the default 1: `verify-affected-set.test.ts` runs rstest `--changed=HEAD~1`, which needs a parent (measured: depth 1 fails it, 2026-10-05).
        with: { repository: a11ign/a11ign, ref: "${{ env.CORE_REF }}", path: core, fetch-depth: 2 }
      - name: Lay this repository's package over the core's own
        run: |
          rm -rf core/packages/lab
          cp -R lab/packages/lab core/packages/lab
      # pnpm/action-setup reads the version out of `packageManager`, and comes before setup-node because `cache: pnpm` shells out to it.
      - uses: pnpm/action-setup@v6
        with: { package_json_file: core/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: core/pnpm-lock.yaml }
      - run: pnpm install --no-frozen-lockfile
        working-directory: core
      # The packages' `dist` is what `@a11ign/*` imports resolve to, in the typecheck and in the tests alike: unbuilt, both fail on the first import (the monorepo's `pretest` does this).
      - run: pnpm run build
        working-directory: core
      # Lint and typecheck run before the tests so a style or type failure reads red without waiting for the suite.
      - run: pnpm exec eslint packages/lab
        working-directory: core
      # The core's OWN program, not a copy of it for lab alone: a second tsconfig laid at the core's root is a file naming lab's paths, which the layer-edge test reads as a new edge, and a
      # reduced `include` lost the declarations the core's program carries (`agent-org`'s modules: TS7016). Lab is in that program once it is laid, so this checks it, and the core with it.
      - run: pnpm exec tsc --noEmit
        working-directory: core
      - run: pnpm exec rstest run --config scripts/rstest/rstest.config.mjs --include "packages/lab/**/*.test.ts"
        working-directory: core
      # This repository's own checks: the workflows, the arming filter, the composition above.
      - run: pnpm install --frozen-lockfile && pnpm run typecheck && pnpm test
        working-directory: lab
