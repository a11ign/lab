# The merge gate. Every pull request and every merge-queue entry runs lint, the typecheck and the tests (`checks`) and the changeset check (`changeset`), and the last job below, `gate`, waits for both. It is
# named `gate` because that is the check `main`'s protection and the `merge-queue-main` ruleset require (`docs/code-repository-protection.json` in a11ign/a11ign names it). `merge_group` is what lets the queue's
# temporary branches run it: a required check that never runs on one blocks the queue for ever.
#
# THIS REPOSITORY IS NOT SELF-CONTAINED, AND CI SAYS SO BY CONSTRUCTION (a11ign/a11ign#2703). `lab` reaches the core's `scripts/`, the private `guards` package, root files and
# unexported files of four published packages by relative path (569 `checkout-path` edges in the core's layer-edge baseline, #3501's finding 2), and its manifest names the
# monorepo's WORKSPACE versions of `@a11ign/evidence`, `judge`, `scorer`, `screenreader-fleet` and `a11ign`, which are not what the registry holds (0.1.0 where it pins 0.2.x), plus
# `@a11ign/control` and `@a11ign/nvda-speech`, which the registry does not have at all. So nothing here installs on its own: the one manifest names them, and there is no lockfile because one could not be written. The job therefore LAYS this repository, whole, AS `packages/lab` (the path the core's own tests name) OVER
# a checkout of a11ign/a11ign at the commit pinned in `CORE_REF`, installs THERE (the workspace resolves what the registry cannot), and runs the core's own eslint and rstest
# config over it: the one toolchain, not a copy of it. `pnpm install` is not frozen because the core's own dependencies move with `CORE_REF`; the install is ephemeral and its lockfile is
# thrown away with the runner.
#
# THE LAB IS NOT A MEMBER OF THE CORE'S WORKSPACE ANY MORE (a11ign/a11ign#3505: `pnpm-workspace.yaml` excludes `!packages/lab`), and three consequences are built into the steps below, each of
# which was a red run before it was a comment: (1) the core's `pnpm install` LAYS its own pinned `packages/lab`, WITHOUT the `*.test.*` files and the manifest, over whatever was put there, so
# the lab's package is laid AFTER the install and the build, not before ("No test files found"); (2) `packages/lab` is untracked in the core, and the lab's tests walk `git ls-files`, so it is
# staged with `git add -f`; (3) the lab has no `node_modules` of its own, so `@a11ign/control` (a package no registry holds) is assembled by hand: control's own manifest at the laid tag, and `src` linked to the core's laid `packages/control/src`
# (what the workspace link was, before #3506 laid control without a manifest). The core's tsconfig EXCLUDES `packages/lab`, so the core's `tsc` does not check it: the lab has its own, `packages/lab/tsconfig.json`, run in the core: it is this repository's ONE tsconfig, and its `scripts/**/*.ts` population is this repository's own tests (a11ign/a11ign#3927, #4215). The lint exemptions the core used to hold for the lab are not held any more: the lab's tests pin their populations.
#
# BUMPING `CORE_REF` IS A PULL REQUEST, and the only way the core's changes reach this repository's CI: Dependabot cannot read a commit pin, so `src/packaging/ci-composition.test.ts` holds
# it to a full commit sha and nothing else. Ubuntu only, and a two-commit checkout of the core: the tests that need the full history say so and skip by name (`lab-extraction.test.ts`); the
# ones that need the corpus, the fleet or the lab's host skip on their own guards. No test here is a verdict on the corpus: that is the lab's, run by the agent driving it.
name: ci

on:
  # `edited` because the changeset check reads the pull request's BODY: adding its `no-release:` line is an edit, and a run that did not repeat would leave the check red on a body that is
  # now right. The cost is the whole gate once per body edit, which is deliberate: the concurrency group below cancels the run an edit interrupts, so an edit must run everything or it
  # would cancel a full run for a partial one.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
  # A red lab baseline must be red on `main` the hour it happens, not found by the next pull request (a11ign/a11ign#4588, chairman, 2026-10-09: this file ran on `pull_request` only, lab's last merge
  # was 13:21Z and nothing noticed that `main` had gone red). `push` is the merge itself; `schedule` is the nightly run, because the tool at its newest tag and the registry move when no commit does.
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # a11ign/a11ign at `d8d9a02fc`, the commit that carries #3506's repoint (`layers.json` at the root, `packages/control` a LAID layer with no tests and no manifest). Was `2af2b40e7`, 23 commits earlier, which still had `packages/control/layers.json`: agent-org's copy of `isolation-gate.mjs` (header: copied at `d8d9a02fc`) names the root file, so `agent-org-wiring` [36] was red at the newest tag until this pin moved (a11ign/a11ign#3972). Why THIS sha and not a later one (measured 2026-10-07, this suite at the newest tool tag, v0.64.0): `d8d9a02fc` leaves 40 of 4,744 red before the lab's tests were taught the layout, core `main` at `9caf1ab3c` leaves 81, and the red set at `d8d9a02fc` is a strict subset of the later one's, so no later sha is better. Older still is #3904's rule: a pre-#3505 core was kept on purpose (a11ign/a11ign#3839) until this suite could run green over a post-split one. Bumping it is a pull request here that runs this job at the new sha: a newer core's tests can fail the lab's, and that is the pin doing its job. A sha and never a branch: a branch moves under a pull request that did not touch it.
  # a11ign/a11ign#4305: MOVED to `8d59c95e5` (core #4227), the first core commit that pins control at `v0.1.14` (`layers.json`, measured with `git show 8d59c95e5:layers.json`). At `d8d9a02fc` the laid control (`v0.1.12`) has no `calibration-judgments` entry in `packages/control/ansible/lab-fetch.yml`, so `lab-fetch-paths.test.ts`, which now names it, failed 2 of 9 ('names entries lab-fetch.yml no longer has'); `v0.1.14` is the first control tag containing control#22. The comment above describes the previous pin and its reasoning, which this bump supersedes.
  # a11ign/a11ign#4427: MOVED to `a7d6a4158` (past core #4503, #4509 and #4511, the fixes for #4499, #4501 and #4502 that the move to `e45068f59` (core #4491, the merge that closes #4408) exposed), past all three migrations that took the core off agent-org's `src/` paths (#4408 scripts, #4409 packages and guards, #4411 workflows). The core at `8d59c95e5` read `src/*.mjs` names the newest agent-org tag no longer ships, which is why the tool was pinned to `v0.87.9` (#4372) until now. The comment above describes older pins and their reasoning, which this bump supersedes.
  # a11ign/a11ign#4569: MOVED to `989c2bcc3c6a3d350cb5d0eb7e612771dfb8589a` (core #4599, the merge that adds the `// STAYS npm` marker to `scripts/release-tags-complete.ts` (a11ign/a11ign#4594), which `no-npm-spawn.test.ts` requires of every allowlisted npm spawn). The oldest core at or after `f3b5c5f59` (the last rename commit of core #4393's first push) that the lab's CI measures green apart from agent-org-wiring [36]/[37], which wait for agent-org#505 and a new tag. It carries the path-name edits agent-org's synced copies now carry (a11ign/a11ign#4557), so `a7d6a4158`, not an ancestor, read them as drifted. The comment above describes the previous pin, which this bump supersedes.
  # a11ign/a11ign#4822: MOVED to `c18c2dab76b795b1c3fec79d43ab3d653879bc9e` (core #4815, which pins control v0.3.5), in the SAME pull request that swaps this repository's tests onto `@a11ign/toolchain/lib/*`: neither is green without the other (measured 2026-10-10). The core's detectors learned the toolchain specifier in the commits that deleted the copies (`c6560f915`, `25f0e9b3e`), so no core commit is both before the deletions and after the detectors: the swapped tests at `989c2bcc3` are 14 `local/git-spawn-scrubbed` errors and 2 required tests red, the old tests at `c18c2dab7` are 58 TS2307. The comment above describes the previous pin, which this bump supersedes.
  # a11ign/a11ign#4798: MOVED to `da027c092c6ce17609599da8eaaefe2f1d3735d8` (core `origin/main` when this was read, past core #4801 at `81c6680ad`, the merge after which the core's `package.json` names no `packages/lab/scripts/*.mjs`: 34 lines at `c18c2dab7`, 0 here), in the SAME pull request that deletes the 35 one-release shims: a pin that still named them would red `referenced-scripts.test.ts` the moment they went. The comment above describes the previous pin, which this bump supersedes.
  CORE_REF: da027c092c6ce17609599da8eaaefe2f1d3735d8

jobs:
  # A releasable change needs a changeset or a `no-release:` line (a11ign/a11ign#4127, the class fix of #4084: screenreader-worker#25 and #26 changed shipped code with no changeset and released
  # nothing). `releasable-paths` is this repository's `dora` entry in a11ign/a11ign `.agent-org/project.json`, character for character: a path that matches nothing passes every pull request.
  # The called workflow is pinned by full sha (toolchain#15's merge commit) and Dependabot's `github-actions` entry moves the pin. On a merge-group entry it succeeds without evaluating.
  # If it goes red on a pull request that should not, say so on a11ign/a11ign#4127: the answer is not a narrower `releasable-paths` here.
  changeset:
    # Not on `push` or `schedule`: the check reads a pull request's body, and those events have none.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    # A called workflow cannot hold more than its caller gives, and this file's `contents: read` alone makes GitHub refuse the whole run at startup (`startup_failure`: no job, no log).
    permissions:
      contents: read
      pull-requests: read
    uses: a11ign/toolchain/.github/workflows/changeset-required.yml@745b552ed550f44cc15c9d797718d350730540ce
    with:
      releasable-paths: src/ scripts/ baselines/ rule-ownership.json CLAUDE.md

  # TWO LEGS, ONE JOB (a11ign/a11ign#4588, chairman, 2026-10-09). `own` is the tests that read nothing outside this repository's tree and `cross-repo` is the ones that do (`scripts/cross-repo-tests.ts` says
  # which, and why): the core's workflows and baselines, and the tool at its newest tag, which move when no lab commit does. A `cross-repo` leg that goes red is reported as its own check and never blocks:
  # `continue-on-error` makes `needs.checks.result` read `success` when only that leg failed, and `gate`, the one required check, reads that. Its tests are retired one by one under
  # a11ign/a11ign#4425 phase 3 (published packages, no live reads), and the leg goes with the last of them. Lint and the typecheck run in `own` only: they are about this repository's files.
  checks:
    name: checks (${{ matrix.scope }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.scope == 'cross-repo' }}
    strategy:
      fail-fast: false
      matrix:
        scope: [own, cross-repo]
    steps:
      - uses: actions/checkout@v7
        with: { path: lab }
      - uses: actions/checkout@v7
        # fetch-depth 2, not the default 1: `verify-affected-set.test.ts` runs rstest `--changed=HEAD~1`, which needs a parent (measured: depth 1 fails it, 2026-10-05).
        with: { repository: a11ign/a11ign, ref: "${{ env.CORE_REF }}", path: core, fetch-depth: 2 }
      # The shared layout check (a11ign/toolchain, ADR 0043; a11ign/a11ign#4210, #4215): a single-package repository keeps its package at the root, with one README and no workspace file. It runs FIRST, so a
      # layout failure reads red without waiting for the install. The toolchain is installed by npm into the runner's temp directory, beside nothing: this repository has no lockfile and its manifest names packages
      # no registry holds, so `pnpm install` here cannot run. The bin has no shebang (`npx … layout-check` is handed to `sh` and dies with exit 2), so the module is run by path with `node`.
      - name: The layout check, on this repository's own tree
        run: |
          version=$(jq -r '.devDependencies["@a11ign/toolchain"]' lab/package.json)
          coverage=$(jq -r '.devDependencies["@rstest/coverage-v8"]' lab/package.json)
          # `typescript` is an OPTIONAL peer the toolchain's `walkTree` requires from ITS OWN directory (`createRequire(import.meta.url)`), which the symlink below does not change: unset, every guard that walks `ts` or `both` fails
          # with "Cannot find module 'typescript'" (measured, a11ign/a11ign#4822). The CORE's version, not this manifest's `^7`: `typescript@7` has no JS entry point, so no `ScriptKind`. The core is checked out above.
          typescript=$(jq -r '.devDependencies.typescript' core/package.json)
          npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/toolchain" "@a11ign/toolchain@$version" "@rstest/coverage-v8@$coverage" "typescript@$typescript"
          node "$RUNNER_TEMP/toolchain/node_modules/@a11ign/toolchain/dist/layout-check.mjs" lab
      # pnpm/action-setup reads the version out of `packageManager`, and comes before setup-node because `cache: pnpm` shells out to it.
      - uses: pnpm/action-setup@v6
        with: { package_json_file: core/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: core/pnpm-lock.yaml }
      - run: pnpm install --no-frozen-lockfile
        working-directory: core
      # The packages' `dist` is what `@a11ign/*` imports resolve to, in the typecheck and in the tests alike: unbuilt, both fail on the first import (the monorepo's `pretest` does this).
      - run: pnpm run build
        working-directory: core
      # AFTER the install and the build, never before: both run the core's `prepare`, which lays the core's PINNED `packages/lab` (tag in `layers.json`) over this one, and that
      # copy has no `*.test.*` and no `package.json`. Then STAGED, because the core's `packages/lab` is gitignored and a lab test that walks `git ls-files` for "every tracked source file" would
      # otherwise walk nothing. Then `@a11ign/control` installed by hand, AFTER the staging so it is not itself a tracked entry (`git ls-files` would list a directory). The lab is not a
      # workspace member, so pnpm gave it no `node_modules`, and without the package rstest cannot resolve `@a11ign/control/fleet-wake`, treats it as an external, and `require()`s a module
      # graph with a top-level `await` (7 test files, measured 2026-10-07). It was a link to the core's `packages/control` until a11ign/a11ign#3506, which made that a LAID layer: `src` and the
      # playbooks, and NO `package.json`, so a link has no `exports` to resolve a subpath through (the same 7 files, measured at core `d8d9a02fc`, a11ign/a11ign#3972). The package is what a workspace
      # used to be: the manifest control publishes at the tag the core laid (`.layer-ref`, written by the lay), and `src` linked from where it was laid. Since a11ign/a11ign#4345 control is FLAT, so its manifest is at the repository ROOT at the laid tag (measured: `raw.githubusercontent.com/a11ign/control/v0.1.14/package.json` is 200, `.../v0.1.14/packages/control/package.json` is 404), while the core still writes `.layer-ref` under `packages/control`.
      # The whole repository is laid, `.github/` and the changesets included: this repository's own tests (`src/packaging/*.test.ts`) read its workflows by relative path, and they are collected by the
      # same `packages/lab/**/*.test.ts` below. Only `.git` stays behind, which would make the laid directory a repository of its own.
      - name: Lay this repository over the core's own `packages/lab`, stage it, and install `@a11ign/control` beside it
        run: |
          rm -rf packages/lab
          mkdir packages/lab
          cp -R ../lab/. packages/lab
          rm -rf packages/lab/.git
          git add -f packages/lab
          control=packages/lab/node_modules/@a11ign/control
          mkdir -p "$control"
          curl -fsSL "https://raw.githubusercontent.com/a11ign/control/$(cat packages/control/.layer-ref)/package.json" -o "$control/package.json"
          ln -s ../../../../control/src "$control/src"
        working-directory: core
      # This repository's own tests import `@a11ign/toolchain/mjs-ratchet` and `/layout-check`, which the toolchain the core pins (0.1.3) does not have. The version the manifest names, installed by the
      # layout step above, is linked into the laid package's own `node_modules`, which resolution reads before the core's, so only the lab's files see it.
      - name: Link the toolchain this repository names beside the laid package
        run: |
          mkdir -p packages/lab/node_modules/@a11ign
          ln -s "$RUNNER_TEMP/toolchain/node_modules/@a11ign/toolchain" packages/lab/node_modules/@a11ign/toolchain
        working-directory: core
      # The core's packaging tests read the TOOL (a11ign/agent-org) by path, and `/home/agent/repos/agent-org` is a host's, not a runner's: the core's own jobs clone it at the newest release tag and export where
      # (`scripts/agent-org-newest-tag.ts`, #3534; `.mjs` until core #4393 renamed it), which is what this step runs, in the core, where the script lives. Without it 53 test files of `packages/lab/src/packaging` fail on `Cannot find module '/home/agent/repos/agent-org/...'`
      # (measured on the sync pull request, a11ign/a11ign#3791). It was PINNED to `v0.87.9` from lab#39 until `CORE_REF` moved past a11ign/a11ign#4408, #4409 and #4411 (#4372, #4427).
      - name: The tool at the newest release tag, cloned for this run, with `agent-org` on PATH (a11ign/a11ign#3534)
        run: node scripts/agent-org-newest-tag.ts --dest="$RUNNER_TEMP/agent-org"
        working-directory: core
      # Lint runs before the tests so a style failure reads red without waiting for the suite. `--no-ignore`, because the core's eslint config IGNORES `packages/lab/**` (it is a laid copy of
      # another repository there), and a plain `eslint packages/lab` over an ignored path lints nothing and exits 0.
      - run: pnpm exec eslint --no-ignore packages/lab
        if: matrix.scope == 'own'
        working-directory: core
      # The core's `tsc --noEmit` is NOT run: its tsconfig excludes `packages/lab` (the laid copy is not the core's to typecheck), so it would check the core and say nothing about the lab. The lab's own
      # program is `packages/lab/tsconfig.json`, which extends the core's and includes the lab's `src`, `scripts`, `nightly` and `tests` (a11ign/a11ign#3927). It lives INSIDE `packages/lab`: a second tsconfig
      # laid at the core's root is a file naming lab's paths, which the layer-edge test reads as a new edge.
      - run: pnpm exec tsc -p packages/lab/tsconfig.json --noEmit
        if: matrix.scope == 'own'
        working-directory: core
      # The package's tests AND this repository's own (`src/packaging/*.test.ts`: the workflows, the arming filter, the composition above, the .mjs ratchet), which are typechecked by the program above and run here too.
      # The selection is read into an array, not expanded from a string: `read -ra` splits on spaces and does not glob, so the `**` stays a pattern for rstest to read.
      - name: The tests of this leg
        run: |
          read -ra selection < <(node packages/lab/scripts/cross-repo-tests.ts --scope=${{ matrix.scope }})
          pnpm exec rstest run --config scripts/rstest/rstest.config.ts "${selection[@]}"
        working-directory: core

  # THE REQUIRED CHECK. `main`'s protection and the `merge-queue-main` ruleset name `gate`, so it stays the one check that answers for the run. It waits for both jobs above and accepts `success`
  # ONLY: `always()` because a job whose need failed is SKIPPED, and a skipped required check counts as passed; and no `skipped` allowance, because the changeset job succeeds on a merge-group
  # entry rather than skipping, so a skip here means it did not run.
  gate:
    needs: [changeset, checks]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Every job ran, and ran clean
        run: |
          # `changeset` reads a pull request's body, so it is SKIPPED on `push` and `schedule` and is success on the rest: a skip anywhere else means it did not run.
          expected=success
          case "${{ github.event_name }}" in push | schedule) expected=skipped ;; esac
          if [ "${{ needs.changeset.result }}" != "$expected" ]; then
            echo "::error::changeset reported '${{ needs.changeset.result }}', not $expected"
            exit 1
          fi
          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "::error::checks reported '${{ needs.checks.result }}', not success"
            exit 1
          fi
