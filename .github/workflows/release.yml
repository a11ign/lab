name: release

# A RELEASE IS A GIT TAG, AND NOTHING ELSE (a11ign/a11ign#2703, #3134; chairman, a11ign/a11ign#928), AND IT IS CUT BY THE ONE SHARED WORKFLOW (a11ign/a11ign#3550, ADR 0043; row #3959).
# lab is published to NO registry (`private: true`, "Never published" in its manifest); what a consumer pins is a TAG of this repository, `v<version>`. This file used to carry the whole
# release in bash. It is now a CALLER of a11ign/toolchain's `release-per-merge.yml`, which reads what the last tag consumed, builds the release commit on no branch, checks the version and
# the CHANGELOG entry, pushes the tag (one atomic push, never forced) and creates the Release. Its own header holds the reasoning; it is not repeated here.
#
# `kind: tag` PUBLISHES NOTHING. The repository's one versioned package is the ROOT `package.json` (a11ign/a11ign#4215 flattened `packages/lab` into the root), so the shared workflow tags it `v<version>` with no
# `lone-package-dir`, which is the shape consumers pin (`a11ign/a11ign` `packages/control/layers.json`), and releases a private root package under `kind: tag`. There is NO LOCKFILE (the manifest names packages no
# registry holds, so none could be written), and the shared workflow then runs `pnpm dlx @changesets/cli` instead of `pnpm install --frozen-lockfile`.
#
# THE PIN IS A FULL SHA, and the `github-actions` entry in `dependabot.yml` moves it in a pull request that is reviewed here. It is toolchain `main`'s head at the merge of #11, and it holds the lockfile-less path.
#
# `id-token: write` IS GRANTED ONLY BECAUSE A CALLED WORKFLOW CAN KEEP OR REDUCE ITS CALLER'S PERMISSIONS, NEVER RAISE THEM: the shared file's `publish` job asks for it, so a caller that
# withheld it would not load. Under `kind: tag` that job is SKIPPED, so no token is minted and nothing is published. NOT VERIFIED until the first run reads it on the row.
#
# THE FIRST TAG WAS CUT BY HAND (`v0.1.0`), and the three after it by this workflow's predecessor. Every existing `v<version>` tag survives: the shared workflow adds to them, and reads what each consumed off
# the release commits the tags point at.
#
# `needs: [gate]` stays: this repository's own guard, ci.yml's `gate` read and waited for on the exact sha, which is also the shared workflow's first job; the second reading costs a poll and
# keeps this repository's own pin of it (`release-workflow.test.ts`) meaningful.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    # Not named `gate`: the check-run this job creates would otherwise answer the query it runs.
    name: ci gate result on this sha
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
    steps:
      - name: Refuse unless this is main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::run on $GITHUB_REF; a release is cut from main only"
            exit 1
          fi
      - name: ci.yml's gate must have succeeded on this sha, and is waited for
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT_SECONDS: '2700'
          POLL_SECONDS: '20'
        run: |
          waited=0
          while :; do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=gate&filter=latest" \
              --jq '.check_runs | map(select(.app.slug == "github-actions")) | first | if . == null then "none" else (.conclusion // "pending") end')
            echo "gate on $GITHUB_SHA: $conclusion (waited ${waited}s)"
            case "$conclusion" in
              success) exit 0 ;;
              none|pending) ;;
              *)
                echo "::error::ci.yml's gate on $GITHUB_SHA is '$conclusion', not 'success'"
                exit 1 ;;
            esac
            if [ "$waited" -ge "$WAIT_SECONDS" ]; then
              echo "::error::ci.yml's gate on $GITHUB_SHA was still '$conclusion' after ${WAIT_SECONDS}s"
              exit 1
            fi
            sleep "$POLL_SECONDS"
            waited=$((waited + POLL_SECONDS))
          done

  release:
    needs: [gate]
    permissions:
      contents: write
      checks: read
      id-token: write
    uses: a11ign/toolchain/.github/workflows/release-per-merge.yml@a86c03b40654c760422d17b491ea4405c360aa8b
    with:
      kind: tag
      gate-check: gate
