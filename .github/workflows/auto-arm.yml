# Enable auto-merge on every open, non-draft pull request against `main`, so nobody arms by hand (a11ign/a11ign#3383).
#
# `gh pr merge --auto` only ARMS the merge. GitHub still withholds it until `main`'s approving review and the
# `gate` check are satisfied, and the merge queue (`merge-queue-main`) builds it on top of `main` first, so arming
# early costs nothing and removes "a session has to notice" as a step in a pull request's life. Before this file
# existed, the sibling repository `a11ign/screenreader-worker` had five pull requests armed by hand (a11ign/a11ign#2701).
#
# This is a deliberately SMALL copy of a11ign/a11ign's `auto-arm.yml`, not a port. That one runs `agent-org arm-pr`, which
# reads `.agent-org/project.json` and `.agent-org/roles/sessions.json` from the checkout it runs in; this repository
# declares no org project, so installing the tool here would mean copying that declaration and keeping it in step. What
# the tool decides that matters here is two rules, and both are stated below: a `hold:` label is a hold, and a pull request whose
# `checks (cross-repo)` leg newly fails is not armed (a11ign/a11ign#5188, after a11ign/agent-org#1045).
#
# THE CROSS-REPO REFUSAL (a11ign/a11ign#5188). `ci.yml` makes the `cross-repo` leg `continue-on-error`, so `gate` reads green while the leg is red and
# such a pull request merges and puts `main` red (lab#92 on 2026-10-12: the leg `failure` on its head, the newest push run's `success`, merged
# anyway). a11ign/agent-org#1045 refuses that in agent-org's own arming doors, and this repository arms through neither, so the same rule is here,
# as a smaller shell form of its `crossRepoRedVerdict`: the head's leg is `failure` AND it fails a test FILE the newest completed push run of
# `ci.yml` on `main` did not. `Cross-repo-red: #n` or `owner/repo#n` in the body, naming an OPEN row, is the exit. A trunk leg that is red too is
# compared file by file from the two job logs (a11ign/a11ign#5192, which first read it `clear` because the arming token could not read a log),
# so a pull request adding a second red file to a red `main` is refused and one failing only the file `main` already fails is not. A log that
# cannot be read, or names no failing file, is `cannot` and leaves the pull request unarmed: it is never an inherited red. The log is the one read
# that needs a grant, `actions: read` in the POLICY (`auto-arm.sts.yaml`); it is the MINTED token's and not `GITHUB_TOKEN`'s, so the minting jobs'
# own `permissions:` stay at `id-token: write`. It is ONE text (`CROSS_REPO_RED_LIB`, below) that both arming jobs `eval`, so
# they cannot drift; every Dependabot pull request is in `arm`'s listing and is approved through `arm-approved`, so those two cover all three paths.
#
# A PULL REQUEST IS ARMED ONLY AFTER ITS LEG HAS CONCLUDED. `arm` fires at `opened`, minutes before the leg exists, so a refusal that read the leg
# at that moment would read nothing and arm: that is how lab#92 was armed at 07:17:55Z with its leg red from 07:22:16Z. A leg that has not concluded
# is waited for (CROSS_REPO_DEADLINE, ten minutes against a leg of about five) and a pull request still pending after that is left unarmed: the next
# `push` to `main`, a body edit (`edited`) or an approving review asks again.
#
# ONE JOB ASKS THE REPOSITORY'S QUESTION, NOT THE EVENT'S PULL REQUEST'S. A pull request that was open before this file
# merged has no `opened` left to fire, and a Dependabot pull request's own event runs with a read-only token. Listing
# every open pull request on each event covers both, and arming is idempotent: a pull request already armed is skipped.
# `workflow_dispatch` is the manual kick for a quiet repository; there is no `schedule`, because GitHub disables
# scheduled workflows after 60 days without activity and a sweep that stops silently reads as slow reviewers.
#
# AN APPROVING REVIEW MARKS A DRAFT READY AND ARMS IT (a11ign/a11ign#4969, ported here by a11ign/a11ign#5045). `arm` ignores drafts and no event of
# its own fires on a review, so the review is the trigger: `relay` (on `pull_request_review`) hands the pull request number to `main`'s copy of
# this file, and `arm-approved` (on `workflow_dispatch`, which the policy already accepts) marks it ready and arms it. `pull_request_review` runs
# the BRANCH'S copy of the file, so no job that mints may ride it: `relay` holds `actions: write` on `GITHUB_TOKEN` and mints nothing.
#
# `pull_request_target` and NOT `pull_request`, for the Dependabot case above: it runs the workflow from `main` with a
# write token. That trigger is unsafe only when the job checks out or runs the pull request's code, and this job has no
# checkout and runs nothing from the pull request: it reads labels through the API and calls `gh pr merge`.
#
# THE ARMING TOKEN IS AN OCTO STS APP TOKEN, NOT A STORED ONE (a11ign/a11ign#4199; a11ign/a11ign#4198 did a11ign/a11ign). A merge
# completed with `GITHUB_TOKEN` fires no workflow events (a11ign/a11ign#416), so `release.yml`'s `push` trigger would not fire after a merge
# this job armed; a merge armed with an app installation token is attributed to that identity and does. `octo-sts/action` mints one per
# run against `.github/chainguard/auto-arm.sts.yaml` and revokes it in its post step, so nothing is stored. There is NO fallback to
# `GITHUB_TOKEN`: a fallback arms with the token that fires nothing, which is #416's defect restored quietly, and a failed mint is a step
# that names itself (this job is `continue-on-error`, so it is an annotation). A policy is read from the DEFAULT branch (octo-sts/app
# v0.11.2), so a pull request that adds or changes it takes effect when it merges.
#
# THIS JOB RUNS `main`'s COPY OF THIS FILE, NEVER A BRANCH'S. `pull_request` would run the branch's copy (`job_workflow_ref` =
# `...@refs/pull/N/merge`, measured on a11ign/a11ign#4191), so no policy could bind it to `main`; `pull_request_target`, `push` and
# `workflow_dispatch` on `main` all run `main`'s, and the policy pins `job_workflow_ref` to `@refs/heads/main`. The token goes through
# `env:` into `GH_TOKEN`, never an argument.
name: auto-arm

on:
  pull_request_target:
    # `edited`: adding the `Cross-repo-red:` line to the body is the exit from a refusal, and it must ask again (#5188).
    types: [opened, ready_for_review, reopened, synchronize, edited]
  push:
    branches: [main]
  # #4969: an APPROVING review is the event on which a draft's wait ends. It runs the file as the PR's merge ref has it, the BRANCH'S copy, so
  # only `relay` rides it (no mint, no policy claim) and `arm-approved` is the `workflow_dispatch` half, which runs `main`'s copy.
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to ready (if still a draft) and arm, when it is approved. Empty runs the sweep only (#4969)"
        required: false
        type: string

env:
  # The cross-repo refusal, one text for `arm` and `arm-approved` (see the header). `eval "$CROSS_REPO_RED_LIB"` defines the functions;
  # the caller sets GH_REPO, GH_TOKEN (the minted token: everything read here is public) and CROSS_REPO_DEADLINE.
  CROSS_REPO_RED_LIB: |
    CROSS_LEG="checks (cross-repo)"

    # `<status> <conclusion> <id>` of the leg in a list of check runs or jobs (key `check_runs` or `jobs`; an Actions check run's id IS its job id,
    # which is what the log is read by); `unread` when the leg is absent from a page that was not read in full; nothing when it is simply absent.
    leg_in() {
      jq -r --arg leg "$CROSS_LEG" --arg key "$1" '
        ([.[$key][] | select(.name == $leg)][0]) as $l
        | if $l != null then "\($l.status) \($l.conclusion // "none") \($l.id)"
          elif .total_count > (.[$key] | length) then "unread" else empty end'
    }

    # The newest COMPLETED push run of ci.yml on main whose verdict is success or failure: a cancelled run says nothing (agent-org's `newestVerdictRun`).
    trunk_run() {
      gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=20" |
        jq -r '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].id // empty'
    }

    # The test FILES a job log says failed, one per line and sorted: rstest's ` FAIL  <file> > <test>` lines (agent-org's `failingFilesFromRstestLog`).
    # Colour escapes and the timestamp come off first, because rstest paints the directory, the file and the `>` separately and the runner
    # puts a timestamp in front of every line. Prints nothing when no line is a FAIL line, which is "could not tell" and never "none failed".
    failing_files() {
      local esc
      esc=$(printf '\033')
      sed -E "s/${esc}\[[0-9;]*m//g; s/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z ?//" |
        sed -nE 's/^[[:space:]]*FAIL[[:space:]]+([^[:space:]]+\.[cm]?[jt]sx?)(:[0-9]+(:[0-9]+)?)?([[:space:]]+>[[:space:]].*)?[[:space:]]*$/\1/p' | sort -u
    }

    # The failing test files of the job `$1`, one per line; or, with return 1, WHY they could not be told. An unreadable log and a log naming no
    # file are both "could not tell", which the caller refuses on: neither is a red that is inherited. `--allow-escape-sequences` because `gh api`
    # REFUSES a response carrying a terminal escape (measured 2026-10-12 on a job log of this repository), and every rstest log carries them.
    leg_files() {
      local log files
      log=$(gh api --allow-escape-sequences "repos/$GH_REPO/actions/jobs/$1/logs" 2>&1) || { echo "the log of job $1 could not be read ($(head -n1 <<<"$log"))"; return 1; }
      files=$(failing_files <<<"$log")
      [ -n "$files" ] || { echo "the log of job $1 names no failing test file"; return 1; }
      printf '%s\n' "$files"
    }

    # 0 when a `Cross-repo-red: #n` / `owner/repo#n` line of the body names an OPEN row; otherwise says why not and returns 1.
    declared_row_open() {
      local rows row state why="" row_re='^([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#([0-9]+)$'
      rows=$(printf '%s\n' "$1" | tr -d '\r' | { grep -iE '^[[:space:]]*Cross-repo-red:' || true; } | sed -E 's/^[^:]*:[[:space:]]*//; s/[[:space:]]+$//')
      [ -n "$rows" ] || { echo "its body carries no \`Cross-repo-red:\` line"; return 1; }
      while IFS= read -r row; do
        if [[ "$row" =~ $row_re ]]; then
          state=$(gh api "repos/${BASH_REMATCH[1]:-$GH_REPO}/issues/${BASH_REMATCH[2]}" --jq .state 2>/dev/null) || state=""
          [ "$state" = open ] && return 0
          why="$why; \`$row\` is ${state:-absent or unreadable}, not open"
        else
          why="$why; \`$row\` is not \`#n\` or \`owner/repo#n\`"
        fi
      done <<<"$rows"
      echo "its \`Cross-repo-red:\` row does not stand${why}"
      return 1
    }

    # ONE LINE, `kind|why`, kind being `clear`, `pending` (the leg has not concluded), `red` (newly red, undeclared) or `cannot` (not readable).
    # agent-org's `crossRepoRedVerdict` in its smaller form: the head's leg is `failure` AND it fails a test file the newest trunk run's leg did not.
    # A trunk leg that was `success` fails none, so every file is new. A trunk leg that is `failure` too is compared FILE BY FILE from the two job
    # logs (`actions: read` in the policy, a11ign/a11ign#5192): a file `main` already fails is the world's red, and one it does not is the pull request's.
    cross_repo_verdict() {
      local pr sha body checks jobs status conclusion leg_id trunk tstatus tconclusion trunk_leg declared own theirs added newly
      pr=$(gh api "repos/$GH_REPO/pulls/$1") || { echo "cannot|pull request #$1 could not be read"; return 0; }
      sha=$(jq -r .head.sha <<<"$pr")
      body=$(jq -r '.body // ""' <<<"$pr")
      checks=$(gh api "repos/$GH_REPO/commits/$sha/check-runs?per_page=100") || { echo "cannot|the check runs of ${sha:0:9} could not be read"; return 0; }
      read -r status conclusion leg_id <<<"$(leg_in check_runs <<<"$checks")"
      [ "$status" != unread ] || { echo "cannot|the check runs of ${sha:0:9} were not read in full"; return 0; }
      if [ "$status" != completed ]; then echo "pending|its \`$CROSS_LEG\` leg has not concluded"; return 0; fi
      if [ "$conclusion" != failure ]; then echo "clear|-"; return 0; fi

      trunk=$(trunk_run) && [ -n "$trunk" ] || { echo "cannot|no completed push run of ci.yml on main to compare the red with"; return 0; }
      jobs=$(gh api "repos/$GH_REPO/actions/runs/$trunk/jobs?per_page=100") || { echo "cannot|the jobs of run $trunk could not be read"; return 0; }
      read -r tstatus tconclusion trunk_leg <<<"$(leg_in jobs <<<"$jobs")"
      [ "$tstatus" = completed ] || { echo "cannot|run $trunk has no concluded \`$CROSS_LEG\` job to compare with"; return 0; }
      newly="the newest push run on main (https://github.com/$GH_REPO/actions/runs/$trunk) had the leg \`success\`"
      case "$tconclusion" in
        success) ;;
        failure)
          own=$(leg_files "$leg_id") || { echo "cannot|the leg of #$1 failed and $own"; return 0; }
          theirs=$(leg_files "$trunk_leg") || { echo "cannot|the leg of #$1 failed on $(paste -sd, - <<<"$own" | sed 's/,/, /g') and the newest trunk run's leg failed too and $theirs"; return 0; }
          added=$(comm -23 <(printf '%s\n' "$own") <(printf '%s\n' "$theirs"))
          # THE RED IS `main`'S OWN ALREADY: every file this leg fails, the newest trunk run's leg failed.
          [ -n "$added" ] || { echo "clear|-"; return 0; }
          newly="the newest push run on main (https://github.com/$GH_REPO/actions/runs/$trunk) did not fail $(paste -sd, - <<<"$added" | sed 's/,/, /g')"
          ;;
        *) echo "cannot|the newest trunk run $trunk read its leg as ${tconclusion:-unfinished}, which says nothing to compare with"; return 0 ;;
      esac
      if declared=$(declared_row_open "$body"); then echo "clear|-"; return 0; fi
      echo "red|$newly, and $declared"
    }

    # Says a refusal ONCE per pull request: the marker is the same for every head, so a pull request that stays red is not told again.
    post_refusal() {
      local number=$1 marker=$2 body=$3
      if gh api --paginate "repos/$GH_REPO/issues/$number/comments?per_page=100" --jq '.[].body' | grep -qF -- "$marker"; then
        echo "AUTO-ARM: #$number already carries this refusal"
      else
        gh api -X POST "repos/$GH_REPO/issues/$number/comments" -f body="$marker"$'\n'"$body" --silent
      fi
    }

    # 0 when #n may be armed as far as the cross-repo leg is concerned. A leg that has not concluded is WAITED FOR until CROSS_REPO_DEADLINE
    # (a pull request armed at `opened` is armed before its leg exists, which is how lab#92 merged red); every other refusal leaves the pull request
    # unarmed and returns 1, with nothing marking it ready either.
    cross_repo_gate() {
      local kind why
      while :; do
        IFS='|' read -r kind why <<<"$(cross_repo_verdict "$1")"
        [ "$kind" = pending ] && [ "$SECONDS" -lt "$CROSS_REPO_DEADLINE" ] || break
        sleep 30
      done
      case "$kind" in
        clear) return 0 ;;
        red)
          echo "AUTO-ARM: NOT arming #$1 -- its \`$CROSS_LEG\` leg newly fails: $why"
          post_refusal "$1" "<!-- arm-refused: cross-repo-red -->" "**Not armed.** The \`$CROSS_LEG\` leg of this pull request fails, and $why."$'\n\n'"That leg is \`continue-on-error\`, so \`gate\` reads green and the merge would put \`main\` red. Add a line \`Cross-repo-red: <row>\` to the body naming the OPEN row that greens it (\`#n\`, or \`owner/repo#n\` for a core-side row); editing the body asks again."
          ;;
        *) echo "AUTO-ARM: leaving #$1 unarmed -- $why" ;;
      esac
      return 1
    }

jobs:
  arm:
    # The sweep's own group, on the JOB: a workflow-level group would also hold `relay` and `arm-approved`, and a group keeps one running and
    # ONE PENDING run, so a review landing while the sweep ran could replace the pending dispatch that is the whole point of this file.
    concurrency:
      group: auto-arm
      cancel-in-progress: false
    # `pull_request_review` runs the branch's copy and the sweep minted nothing there before; a dispatch carrying a `pr` is `arm-approved`'s.
    if: github.event_name != 'pull_request_review' && github.event.inputs.pr == ''
    # It acts on pull requests other than the one whose event woke it, and gates nothing (`main` requires `gate` only),
    # so a failure is an annotation and never a red check charged to a diff that did not earn it.
    continue-on-error: true
    # The job's own `GITHUB_TOKEN` holds only what the job itself needs: a checkout (`contents: read`) and the OIDC request Octo STS needs (`id-token: write`).
    # The writes come from the minted token, whose grant is `auto-arm.sts.yaml`'s.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      # The base branch's own copy of `.github/auto-arm.jq`: on `pull_request_target` a checkout WITHOUT `ref:` is `main`,
      # never the pull request, so this still runs nothing a pull request wrote.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/auto-arm.jq
      - name: Mint the arming token (Octo STS, `auto-arm.sts.yaml`) -- no fallback to `GITHUB_TOKEN`, see the header (a11ign/a11ign#4199)
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: auto-arm
      - name: Arm every open, non-draft, unheld pull request against main that nothing has armed
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          eval "$CROSS_REPO_RED_LIB"
          CROSS_REPO_DEADLINE=$((SECONDS + 600))
          # `--limit 200` and not the default 30: a list that silently stops at 30 is a sweep that quietly arms 30.
          # The selection is `.github/auto-arm.jq`, which `src/packaging/auto-arm-filter.test.ts` runs in the gate.
          numbers=$(gh pr list --state open --base main --limit 200 \
            --json number,isDraft,labels,autoMergeRequest | jq -r -f .github/auto-arm.jq)
          failed=0
          for n in $numbers; do
            # Refused, still pending or unreadable: left unarmed, said once on the pull request (a red) or in this log (the rest).
            cross_repo_gate "$n" || continue
            if gh pr merge --auto --merge "$n"; then
              echo "ARMED #$n"
            else
              echo "::error::could not arm #$n"
              failed=1
            fi
          done
          [ -n "$numbers" ] || echo "nothing to arm: every open, non-draft, unheld pull request is already armed"
          exit "$failed"

  # ## An approving review marks a draft ready and arms it, with no worker turn (a11ign/a11ign#4969, ported by a11ign/a11ign#5045)
  #
  # TWO JOBS, BECAUSE THE EVENT RUNS THE BRANCH'S FILE. `relay` is the only job `pull_request_review` runs: it holds `actions: write` on
  # `GITHUB_TOKEN`, mints nothing and sends the PR number to `main`'s copy (`gh workflow run --ref main`; a dispatch made with `GITHUB_TOKEN` is
  # one of the two events that DOES start a run). A branch that edits `relay` gains nothing it did not have: any branch workflow could already
  # dispatch. `arm-approved` then runs as `workflow_dispatch` on `refs/heads/main`, which `auto-arm.sts.yaml` already accepts
  # (`event_name: pull_request_target|push|workflow_dispatch`), so the policy gains no claim and the `job_workflow_ref` binding is untouched.
  #
  # THE DISPATCH IS NOT TRUSTED FOR THE DECISION. `arm-approved` re-reads the PR as the minted token and acts only on `reviewDecision ==
  # APPROVED` (what branch protection itself waits on), an open PR against `main`, a head in this repository and no `hold:` label. A held,
  # forked, closed, CHANGES_REQUESTED or already-armed pull request is left untouched: nothing marks it ready either.
  relay:
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Hand the approved pull request to `main`'s copy of this workflow (#4969)
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # `main` declares no `pr` input until this change has landed, and GitHub then answers 422 "Unexpected inputs provided": there is
          # nothing to hand the number to yet, which is not this pull request's failure. Any OTHER refusal stays red.
          if ! out=$(gh workflow run auto-arm.yml --repo "$REPOSITORY" --ref main -f pr="$PULL_REQUEST" 2>&1); then
            case "$out" in
              *"Unexpected inputs provided"*) echo "::notice::main's copy of auto-arm.yml declares no pr input yet, so there is nothing to hand #${PULL_REQUEST} to"; exit 0 ;;
            esac
            echo "$out" >&2
            exit 1
          fi

  arm-approved:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.pr != ''
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Mint the arming token (Octo STS, `auto-arm.sts.yaml`) -- no fallback to `GITHUB_TOKEN`, see the header (a11ign/a11ign#4199)
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: auto-arm
      - name: Mark an approved draft ready and arm it -- unless held, forked, closed or not against main (#4969)
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.inputs.pr }}
        run: |
          eval "$CROSS_REPO_RED_LIB"
          CROSS_REPO_DEADLINE=$((SECONDS + 600))
          case "$PULL_REQUEST" in ''|*[!0-9]*) echo "::error::AUTO-ARM: pr input '$PULL_REQUEST' is not a pull request number"; exit 1;; esac
          # An approval is readable a moment after the review event, so a dispatch that outruns it asks again before it refuses.
          for attempt in 1 2 3; do
            pr=$(gh pr view "$PULL_REQUEST" --json state,baseRefName,isCrossRepository,reviewDecision,isDraft,labels,autoMergeRequest)
            [ "$(jq -r .reviewDecision <<<"$pr")" = APPROVED ] && break
            sleep 5
          done
          verdict=$(jq -r '
            [.labels[].name | select(startswith("hold:"))] as $holds
            | if .state != "OPEN" then "skip: the pull request is " + .state
              elif .baseRefName != "main" then "skip: its base is " + .baseRefName + ", not main"
              elif .isCrossRepository then "skip: its head is in a fork"
              elif .reviewDecision != "APPROVED" then "skip: reviewDecision is \(.reviewDecision | if . == "" then "empty" else . end), not APPROVED"
              elif ($holds | length) > 0 then "skip: held by " + ($holds | join(", "))
              elif .isDraft then "ready"
              elif .autoMergeRequest != null then "skip: already armed"
              else "arm" end' <<<"$pr")
          case "$verdict" in
            skip:*) echo "AUTO-ARM: leaving #${PULL_REQUEST} in ${GH_REPO} untouched -- ${verdict#skip: }"; exit 0;;
          esac
          # Before it is marked ready as well as before it is armed: a refused pull request is left exactly as it was found (#5188).
          cross_repo_gate "$PULL_REQUEST" || exit 0
          case "$verdict" in
            ready) echo "AUTO-ARM: #${PULL_REQUEST} is an approved draft: marking it ready"; gh pr ready "$PULL_REQUEST";;
          esac
          gh pr merge --auto --merge "$PULL_REQUEST"
          echo "ARMED #${PULL_REQUEST}"
