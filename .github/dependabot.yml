# Dependency updates come from the platform (a11ign/a11ign ADR 0041, decision 4): a new release of anything this repository consumes opens a pull request here, so nobody polls for one.
# What it consumes by VERSION is the `github-actions` below, the root's dev dependencies, and `packages/lab`'s own third-party dependencies (`@guidepup/guidepup`, `serve`, `typescript`, `yaml`).
# Its `@a11ign/*` entries name the monorepo's WORKSPACE versions (0.2.x where the registry holds 0.1.0, and two packages it does not hold at all), so a bump of one is a pull request that
# `ci.yml` installs through the core's workspace, and the checkout of a11ign/a11ign that CI lays it over is a commit pin Dependabot cannot read: bumping `CORE_REF` is a pull request by hand.
# NOT VERIFIED until Dependabot has run here once: the `/packages/lab` entry has no lockfile of its own, so it can only rewrite the manifest.
version: 2
updates:
  - package-ecosystem: npm
    # The root's own dev dependencies (the changeset CLI, tsx, typescript). `packages/lab` has its own entry below.
    directory: /
    schedule:
      interval: daily
    # No `groups:` on purpose: each dependency is its own pull request, which is what keeps a bump small and mergeable alone.
    commit-message:
      # The handle the org's gate recognises a dependency pull request by: every title starts `deps:`.
      prefix: deps
  - package-ecosystem: npm
    directory: /packages/lab
    schedule:
      interval: daily
    commit-message:
      prefix: deps
    ignore:
      # `@a11ign/screenreader-worker` is declared in `packages/lab/package.json`, which is why the ignore sits on THIS entry and not the root's.
      # 0.2.0 is a BUILD where 0.1.0 shipped raw `src`, and merging that bump breaks `a11ign-worker-code`. This is DATA rather than a sentence
      # so no pull request is opened to merge by mistake; remove it when a11ign/a11ign#3740 (the expected-hash row) merges.
      # Ruling: a11ign/a11ign#3552, row a11ign/a11ign#3739.
      - dependency-name: "@a11ign/screenreader-worker"
        versions: [">=0.2.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: deps
