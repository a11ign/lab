<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Create your account</title>
<style>body{font-family:system-ui,sans-serif;max-width:24rem;margin:2rem auto}label{display:block;margin-top:1rem}input{width:100%;box-sizing:border-box}</style>
</head>
<body>
<!--
  WCAG 3.3.7 Redundant Entry corpus NEGATIVE: a pattern that asks twice and must NOT read as a failure. The
  Understanding page names it as an exception: "Security measures such as preventing a password string from being
  shown or copied. When creating a password, it should be a unique and complex string and therefore cannot be
  validated by the author. If the system requires the user to manually create a password that is not displayed,
  having users re-validate their new string is allowed as an exception"
  (https://www.w3.org/WAI/WCAG22/Understanding/redundant-entry).
  Its labels pair up exactly as email-confirm-bad.html's do ("Confirm ..." after "..."), which is the point: a
  heuristic that flags two fields asking the same thing trips here, and a rule that reads the field type does not.
-->
<h1>Create your account</h1>
<form action="#" method="post">
  <label for="new-password">New password</label>
  <input id="new-password" name="new-password" type="password" autocomplete="new-password" required>
  <label for="new-password-confirm">Confirm new password</label>
  <input id="new-password-confirm" name="new-password-confirm" type="password" autocomplete="new-password" required>
  <p><button type="submit">Create account</button></p>
</form>
</body>
</html>
