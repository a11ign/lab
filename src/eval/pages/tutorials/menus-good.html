<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Acme - Home (accessible menu)</title>
<style>body{font-family:system-ui,sans-serif;max-width:42rem;margin:2rem auto} .fakeheading{font-size:1.5rem;font-weight:700;margin:1.2rem 0 .4rem} .iconbtn{border:0;background:#eee;padding:.4rem} nav ul{list-style:none;display:flex;gap:1rem;padding:0} /* `nav ul{display:flex}` above OVERRIDES the `hidden` attribute, which is only `display:none` from the UA stylesheet, so an author `display` wins and the submenu stayed visible while `aria-expanded` said false. The first recapture proved it: the fly-out's links were still in the read-through before anything was activated. `[hidden]` is more specific than `nav ul`, so this makes the attribute mean what it says. */ [hidden]{display:none}</style>
</head>
<body>
<nav aria-label="Main">
  <ul>
    <li><a href="/" aria-current="page">Home</a></li>
    <li><a href="/products">Products</a></li>
    <!-- A WORKING fly-out. `aria-expanded` used to be here with no script and an unhidden submenu, which
         made it a false statement: the panel was always visible, so "collapsed" was never true and
         activating the button changed nothing. That is the exact evidence signature of a real
         4.1.2 state-change failure, and the trained scorer reported this ground-truth-conformant page as
         failing 4.1.2 at 0.9873 -- correctly, for a defect nobody meant to author. The pair here tests
         NAMING (bad = unnamed icon button), so the disclosure state was incidental and wrong.
         Same shape as disclosure-good.html and the generated corpus's conformant disclosure: toggle
         `aria-expanded` AND the panel's `hidden`, so the announced state matches reality. -->
    <li><button type="button" aria-expanded="false" aria-controls="support-menu"
          onclick="var x=this.getAttribute('aria-expanded')==='true';this.setAttribute('aria-expanded',String(!x));document.getElementById('support-menu').hidden=x;">Support</button>
      <ul id="support-menu" hidden><li><a href="/help">Help center</a></li><li><a href="/contact">Contact</a></li></ul></li>
  </ul>
</nav>
<main><h1>Home</h1><p>Welcome to Acme.</p></main>
</body>
</html>
